[package]
name = "vibeanimate-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tauri = "=2.12.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[build-dependencies]
tauri-build = "=2.7.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
